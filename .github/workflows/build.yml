# Сборка по тегу v* (git tag v1.0.9 && git push origin v1.0.9): версия из тега
# → tools/build.py --linux → релиз с TorrServer-Tizen.wgt и архивами для Linux.
# Пакет для ТВ без подписи: сертификат Samsung привязан к телевизору (DUID),
# подписывает тот, кто ставит, — Apps2Samsung или Tizen Studio (см. README).
# Постоянные имена — releases/latest/download/TorrServer-Tizen.wgt и т. п.
# Запуск вручную (Actions → build → Run workflow) — только сборка, файлы в артефакте.
name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Сборка
        run: |
          VER=""
          case "$GITHUB_REF" in refs/tags/v*) V="${GITHUB_REF_NAME#v}"; VER="--version ${V%%-*}";; esac
          python3 tools/build.py $VER --linux
          ls -la dist

      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" dist/TorrServer-Tizen.wgt dist/TorrServer-linux-x64.tar.gz dist/TorrServer-linux-arm64.tar.gz $PRE \
            --title "TorrServer для Samsung Tizen ${GITHUB_REF_NAME#v}" \
            --notes "TorrServer на C# (MonoTorrent) с API TorrServer MatriX на порту 8090 — работает и на Tizen 5.5, где официальный TorrServer не запускается. TorrServer-Tizen.wgt ставится на телевизор через Apps2Samsung (Custom WGT) или Tizen Studio и запускается вместе с телевизором; в TorrStream — «Использовать TorrServer, установленный на этом устройстве». Архивы TorrServer-linux-*.tar.gz — та же служба для Linux, .NET ставить не нужно: tar xzf, затем ./TorrServer 8090. Подробнее — в README."

      - name: Артефакт
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: TorrServer-Tizen
          path: dist/*
          retention-days: 7
